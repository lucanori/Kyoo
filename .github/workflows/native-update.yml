name: Native update
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm publishing an Expo OTA update
        type: boolean
        default: false

permissions: {}

# Upstream reference only: Expo OTA publishing is disabled on lucanori/Kyoo.
# No ENABLE_EXPO_UPDATE opt-in variable exists for this fork.
jobs:
  update:
    name: Expo Update
    if: github.repository == 'zoriya/Kyoo' && inputs.confirm_publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./front
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb24136458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: yarn
          cache-dependency-path: front/yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable

      - name: Publish update
        run: yarn update
