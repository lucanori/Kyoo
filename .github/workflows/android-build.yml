name: Android APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which APK(s) to build
        type: choice
        default: both
        options:
          - both
          - development
          - release
      tv:
        description: Build the Android TV (leanback) app instead of the phone app
        type: boolean
        default: false
  workflow_call:
    inputs:
      variant:
        description: Which APK(s) to build (development, release or both)
        type: string
        default: release
      tv:
        description: Build the Android TV (leanback) app instead of the phone app
        type: boolean
        default: false
      release-tag:
        description: Tag of the release (e.g. v1.2.3)
        type: string
        default: ""

permissions: {}

concurrency:
  group: android-build-${{ github.ref }}-${{ inputs.variant }}-${{ inputs.tv }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve variants
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      variants: ${{ steps.compute.outputs.variants }}
      trusted_signing: ${{ steps.compute.outputs.trusted_signing }}
    steps:
      - id: compute
        env:
          VARIANT: ${{ inputs.variant || 'both' }}
          REF: ${{ github.ref }}
        run: |
          TRUSTED_SIGNING="false"
          case "$REF" in
            refs/heads/master|refs/heads/next|refs/tags/v*)
              TRUSTED_SIGNING="true"
              ;;
          esac

          case "$VARIANT" in
            both)
              if [ "$TRUSTED_SIGNING" != "true" ]; then
                echo "::error::Signed release APK builds are only allowed from master, next, or v* tags (got $REF)." >&2
                exit 1
              fi
              echo 'variants=["development","release"]' >> "$GITHUB_OUTPUT"
              ;;
            release)
              if [ "$TRUSTED_SIGNING" != "true" ]; then
                echo "::error::Signed release APK builds are only allowed from master, next, or v* tags (got $REF)." >&2
                exit 1
              fi
              echo 'variants=["release"]' >> "$GITHUB_OUTPUT"
              ;;
            development)
              echo 'variants=["development"]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown variant: $VARIANT" >&2
              exit 1
              ;;
          esac
          echo "trusted_signing=$TRUSTED_SIGNING" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.variant }} APK
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      EXPO_TV: ${{ inputs.tv && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    defaults:
      run:
        working-directory: ./front
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-read-only: false
          cache-cleanup: on-success
          add-job-summary: never

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1
        with:
          key: ccache-android-${{ matrix.variant }}
          max-size: 1G

      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('front/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native project
        env:
          APP_VARIANT: ${{ matrix.variant == 'development' && 'development' || '' }}
          EXPO_NO_TELEMETRY: "1"
          RUN_NUMBER: ${{ github.run_number }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            export APP_VERSION="${RELEASE_TAG#v}"
          else
            export APP_VERSION="$REF_NAME-${SHA:0:7}"
          fi
          echo "versionName=$APP_VERSION"
          # the phone and tv apks share a package name, so we keep a distinct
          # (and always increasing) versionCode for each.
          if [ -n "$EXPO_TV" ]; then
            ANDROID_VERSION_CODE=$((RUN_NUMBER * 10 + 1))
          else
            ANDROID_VERSION_CODE=$((RUN_NUMBER * 10))
          fi
          export ANDROID_VERSION_CODE
          echo "versionCode=$ANDROID_VERSION_CODE"
          bunx expo prebuild --platform android --no-install

      - name: Disable release lint (lintVital)
        working-directory: ./front/android
        run: |
          printf '\nandroid {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n}\n' >> app/build.gradle

      - name: Build APK
        working-directory: ./front/android
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "development" ]; then
            ./gradlew :app:assembleDebug --build-cache --stacktrace
          else
            ./gradlew :app:assembleRelease --build-cache --stacktrace \
              -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          fi

      - name: Sign APK
        if: needs.matrix.outputs.trusted_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD." >&2
            exit 1
          fi
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/kyoo.jks"
          ALIGNED_APK="$RUNNER_TEMP/aligned.apk"
          trap 'rm -f "$KEYSTORE_PATH" "$ALIGNED_APK"' EXIT

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          if [ "$VARIANT" = "development" ]; then
            APK=android/app/build/outputs/apk/debug/app-debug.apk
          else
            APK=android/app/build/outputs/apk/release/app-release.apk
          fi
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Collect APK
        id: apk
        env:
          TV_SUFFIX: ${{ inputs.tv && '-tv' || '' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "development" ]; then
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
            OUT="kyoo-dev$TV_SUFFIX.apk"
          else
            SRC=android/app/build/outputs/apk/release/app-release.apk
            OUT="kyoo$TV_SUFFIX.apk"
          fi
          cp "$SRC" "$OUT"
          echo "name=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: front/${{ steps.apk.outputs.name }}
          if-no-files-found: error
