name: Deploy Chromecast Receiver

on:
  push:
    branches:
      - master
    paths:
      - "chromecast/**"
      - ".github/workflows/chromecast-pages.yml"
  workflow_dispatch:

concurrency:
  group: chromecast-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build receiver
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./chromecast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload artifact
        if: vars.ENABLE_CHROMECAST_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./chromecast/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: vars.ENABLE_CHROMECAST_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d04e342629a3f51346 # v5
